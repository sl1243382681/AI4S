<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zeroAI4S</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    background: #fff; color: #2b2b2b; height: 100vh; display: flex; overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  /* ---------- 侧边栏 ---------- */
  .sidebar { width: 300px; flex-shrink: 0; background: #F1F4FA; padding: 24px 20px 16px;
             display: flex; flex-direction: column; }
  .side-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .logo { font-size: 34px; font-weight: 700; color: #1E2A78; letter-spacing: -1px; }
  .logo span { color: #3B5BFF; }
  .icon-btn { width: 40px; height: 40px; border-radius: 8px; font-size: 22px; color: #555; }
  .icon-btn:hover { background: #E1E7F3; }
  .segment { display: flex; background: #E5E8EF; border-radius: 20px; padding: 4px; margin-bottom: 22px; }
  .segment button { flex: 1; padding: 9px 0; font-size: 17px; color: #333; border-radius: 16px; }
  .segment button.on { background: #fff; }
  .nav button { width: 100%; text-align: left; font-size: 18px; color: #333; padding: 12px 14px;
                border-radius: 16px; margin-bottom: 6px; display: flex; gap: 14px; }
  .nav button:hover { background: #E7EBF4; }
  .nav button.on { background: #fff; font-weight: 700; color: #111; }
  .hline { height: 1px; background: #E3E6EE; }
  .side-sec { margin: 16px 0 0 4px; font-size: 16px; color: #8A8F9C; }
  .side-foot { margin-top: auto; }
  .user { font-size: 15px; color: #555; padding-top: 12px; }

  /* ---------- 主区域 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .top { padding: 44px 40px 22px; border-bottom: 1px solid #E8EAF0; }
  .page-title { font-size: 42px; font-weight: 800; margin-bottom: 18px; }
  .pills { display: flex; flex-wrap: wrap; gap: 18px; }
  .pill { height: 46px; padding: 0 22px 0 24px; border-radius: 23px; background: #F1F3F8;
          display: flex; align-items: center; gap: 36px; font-size: 17px; font-weight: 700; color: #4A4F5C; }
  .pill small { font-size: 13px; font-weight: 400; color: #8A8F9C; }
  .pill.on { background: #1F232F; color: #fff; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  .pill.on small { color: #D5D8E0; }

  .body { flex: 1; overflow-y: auto; padding: 32px 40px 40px; }
  .sec-head { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  .sec-icon { font-size: 28px; color: #8A93A8; }
  .sec-cn { font-size: 26px; font-weight: 800; }
  .sec-en { font-size: 13px; font-weight: 600; color: #6B7280; letter-spacing: 2.5px; margin-top: 2px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 34px; }
  .card { background: #F2F6FF; border: 1px solid #DCE6FA; border-radius: 28px; padding: 18px;
          display: flex; flex-direction: column; transition: transform .2s, box-shadow .2s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(40,80,200,.12); }
  .cover { height: 170px; border-radius: 18px; background-size: cover; background-position: center; }
  .card h3 { font-size: 22px; font-weight: 700; margin: 24px 0 12px 4px; }
  .card p { font-size: 15px; line-height: 1.65; color: #8A8F9C; margin: 0 4px 14px; min-height: 50px;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .hline { margin: 0 4px 14px; }
  .card-foot { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
  .org { font-size: 15px; color: #7B8190; }
  .go { width: 64px; height: 36px; border-radius: 18px; background: #1D5CF5; color: #fff; font-size: 20px; }
  .go:hover { background: #1448CC; }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .top, .body { padding-left: 20px; padding-right: 20px; }
    .grid { grid-template-columns: 1fr; }
    .page-title { font-size: 32px; }
    .pill { gap: 16px; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="side-head">
    <div class="logo">zero2<span>x</span> Lab</div>
    <div>
      <button class="icon-btn">⌕</button><button class="icon-btn">⇤</button>
    </div>
  </div>
  <div class="segment"><button class="on">对话</button><button>科研</button></div>
  <div class="nav" id="nav"></div>
  <div class="hline" style="margin-top:10px"></div>
  <div class="side-sec">对话</div>
  <div class="side-foot"><div class="hline"></div><div class="user">👤 用户</div></div>
</aside>

<main class="main">
  <div class="top">
    <div class="page-title">科学应用</div>
    <div class="pills" id="pills"></div>
  </div>
  <div class="body">
    <div class="sec-head">
      <div class="sec-icon" id="secIcon"></div>
      <div><div class="sec-cn" id="secCn"></div><div class="sec-en" id="secEn"></div></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</main>

<script>
// image 填图片路径（如 "img/a.jpg"）即显示封面；留空则用 colors 渐变占位
const DATA = {
  "地球科学": { en: "Earth Science", icon: "🌐", apps: [
    { title: "Deep-time Earth", org: "之江实验室", image: "", colors: ["#C9887A", "#3A4A4A"],
      desc: "统一组织多源地学数据，让地表、深地与深时信息在同一四维环境中实现关联表达与交互探索。", url: "#" },
    { title: "油气勘探工作台", org: "之江实验室", image: "", colors: ["#1E3A5F", "#C98A3B"],
      desc: "面向油气勘探数据分析与综合评价的一体化智能工作台，支持地震数据解释、井震联合建模和测井解释等专业应用。工作台可调用 GeoGPT 多模态能力。", url: "#" },
    { title: "IRDR Research Agent", org: "IRDR", image: "", colors: ["#DDE6EE", "#1C6BB5"],
      desc: "灾害风险综合研究智能体，辅助文献检索、数据分析与报告生成。", url: "#" }
  ]},
  // 以下为占位内容，请替换成真实数据
  "数学科学": { en: "Mathematical Science", icon: "∑", apps: [
    { title: "数学推理助手", org: "之江实验室", image: "", colors: ["#6C5CE7", "#A29BFE"], desc: "面向数学推理与证明辅助的智能工具。", url: "#" },
    { title: "符号计算工作台", org: "之江实验室", image: "", colors: ["#00B894", "#55EFC4"], desc: "支持符号推导、公式化简与可视化。", url: "#" }
  ]},
  "天文学": { en: "Astronomy", icon: "✦", apps: [
    { title: "天文数据分析助手", org: "之江实验室", image: "", colors: ["#0B132B", "#5BC0BE"], desc: "巡天数据检索、星表交叉匹配与光变曲线分析。", url: "#" }
  ]},
  "材料科学": { en: "Materials Science", icon: "⬡", apps: [
    { title: "材料发现工作台", org: "之江实验室", image: "", colors: ["#636E72", "#DFE6E9"], desc: "材料性质预测、结构检索与候选材料筛选。", url: "#" }
  ]},
  "三体计算星座": { en: "Three-Body Constellation", icon: "◎", apps: [
    { title: "三体计算星座", org: "之江实验室", image: "", colors: ["#000428", "#004E92"], desc: "太空计算星座的任务编排与资源调度。", url: "#" }
  ]}
};

const NAV = [["💬","新对话"],["📖","科学知识库"],["🗄","科学数据集"],["🤖","科学工具"],["〰","科学应用"]];

const $ = id => document.getElementById(id);

// 侧边栏导航
$("nav").innerHTML = NAV.map(([i, t]) =>
  `<button class="${t === "科学应用" ? "on" : ""}">${i}&nbsp;&nbsp;${t}</button>`).join("");
$("nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#nav button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
});

// 顶部分类胶囊
$("pills").innerHTML = Object.entries(DATA).map(([name, d]) =>
  `<button class="pill" data-name="${name}">${name}<small>${d.apps.length}</small></button>`).join("");
$("pills").addEventListener("click", e => {
  const b = e.target.closest(".pill"); if (b) show(b.dataset.name);
});

// 渲染某个分类
function show(name) {
  const d = DATA[name];
  document.querySelectorAll(".pill").forEach(p => p.classList.toggle("on", p.dataset.name === name));
  $("secIcon").textContent = d.icon;
  $("secCn").textContent = name;
  $("secEn").textContent = d.en;
  $("grid").innerHTML = d.apps.map(a => {
    const bg = a.image ? `url('${a.image}')` : `linear-gradient(135deg, ${a.colors[0]}, ${a.colors[1]})`;
    return `
      <div class="card">
        <div class="cover" style="background-image:${bg}"></div>
        <h3>${a.title}</h3>
        <p>${a.desc}</p>
        <div class="hline"></div>
        <div class="card-foot">
          <span class="org">🏛&nbsp; ${a.org}</span>
          <a href="${a.url}"><button class="go">→</button></a>
        </div>
      </div>`;
  }).join("");
}
show("地球科学");
</script>
</body>
</html>
